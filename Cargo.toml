[package]
name = "xenomit-bot-runtime"
version = "0.1.0"
edition = "2024"
description = "GUI-free Xenomit bot runtime: behavior worker, statistics journal, panel agent link, packet client adapter, star catalog"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "time"] }
xenomit_backpage = { path = "../xenomit-backpage" }
xenomit-behavior-engine = { path = "../xenomit-behavior-engine" }
xenomit-game-api = { path = "../xenomit-game-api" }
xenomit-packet-client = { path = "../xenomit-packet-client", features = ["game-api"] }
roxmltree = "0.20"
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "native-tls"] }
